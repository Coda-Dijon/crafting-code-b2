[book]
title = "Crafting Code B2"
authors = ["Yoan Thirion"]
language = "fr"
src = "."

[output.html]
default-theme = "light"
preferred-dark-theme = "coda"
additional-css = ["theme/css/coda.css"]
site-url = "/crafting-code-b2/"
git-repository-url = "https://github.com/ythirion/crafting-code-b2"
additional-js = ["js/mermaid.min.js", "js/mermaid-init.js"]

[output.html.search]
enable = true

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html.playground]
editable = false
